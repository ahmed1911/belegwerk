name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Schnell und breit: alle PHP-Versionen, ohne Dienste. Tests, die Gotenberg/veraPDF brauchen, werden hier übersprungen.
  unit:
    name: PHP ${{ matrix.php }} (${{ matrix.deps }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: [highest]
        include:
          - php: '8.2'
            deps: lowest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none
      - run: composer validate --strict
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.deps }}
      - run: vendor/bin/phpunit --exclude-group schematron

  # Vollständig: Gotenberg + veraPDF aus compose.yaml, KoSIT-Validator als Daemon. Hier darf nichts übersprungen werden.
  integration:
    name: Integration (Gotenberg, veraPDF, KoSIT)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Runs in the background while PHP and Java are set up; "Wait for services" waits for it.
      - name: Start Gotenberg and veraPDF
        run: nohup docker compose --profile test up -d --quiet-pull > /tmp/compose.log 2>&1 &
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache KoSIT validator and XRechnung configuration
        uses: actions/cache@v4
        with:
          path: ~/kosit
          key: kosit-${{ hashFiles('tests/SchematronTest.php', '.github/workflows/ci.yml') }}
      # One daemon instead of one JVM per invoice; the configuration URL comes from SchematronTest::CONFIGURATION.
      - name: Start KoSIT validator
        run: |
          if [ ! -f ~/kosit/scenarios.xml ]; then
            mkdir -p ~/kosit && cd ~/kosit
            curl -sSfL -o validator.zip https://github.com/itplr-kosit/validator/releases/download/v1.5.0/validator-1.5.0-distribution.zip
            curl -sSfL -o configuration.zip "$(grep -oP "CONFIGURATION = '\K[^']+" "$GITHUB_WORKSPACE/tests/SchematronTest.php")"
            unzip -q validator.zip && unzip -q -o configuration.zip && rm validator.zip configuration.zip
          fi
          cd ~/kosit
          nohup java -jar validationtool-1.5.0-standalone.jar -s scenarios.xml -r "$PWD" -D -G -H 127.0.0.1 -P 8081 > kosit.log 2>&1 &
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Wait for services
        run: |
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null http://127.0.0.1:3000/health
          curl -s --retry 60 --retry-delay 2 --retry-all-errors -o /dev/null http://127.0.0.1:3001/
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null http://127.0.0.1:8081/server/health
      - run: vendor/bin/phpunit --fail-on-skipped
        env:
          KOSIT_URL: http://127.0.0.1:8081
      - name: Service logs
        if: failure()
        run: |
          cat /tmp/compose.log
          docker compose logs
          cat ~/kosit/kosit.log
