name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Schnell und breit: alle PHP-Versionen, ohne Dienste. Tests, die Gotenberg/veraPDF brauchen, werden hier übersprungen.
  unit:
    name: PHP ${{ matrix.php }} (${{ matrix.deps }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        deps: [highest]
        include:
          - php: '8.2'
            deps: lowest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none
      - run: composer validate --strict
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.deps }}
      - run: vendor/bin/phpunit --exclude-group schematron

  # Vollständig: Gotenberg + veraPDF aus compose.yaml, KoSIT-Validator mit Java. Hier darf nichts übersprungen werden.
  integration:
    name: Integration (Gotenberg, veraPDF, KoSIT)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Start Gotenberg and veraPDF
        run: docker compose up -d
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Cache KoSIT validator and XRechnung configuration
        uses: actions/cache@v4
        with:
          path: /tmp/belegwerk-kosit
          key: kosit-${{ hashFiles('tests/SchematronTest.php', 'composer.json') }}
      - name: Wait for services
        run: |
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null http://127.0.0.1:3000/health
          curl -s --retry 60 --retry-delay 2 --retry-all-errors -o /dev/null http://127.0.0.1:3001/
      - run: vendor/bin/phpunit --fail-on-skipped
      - name: Service logs
        if: failure()
        run: docker compose logs
