# Gotenberg for belegwerk. Templates may come from untrusted users, so Chromium runs without
# JavaScript and may only load the files belegwerk sends (fonts and images go in as data: URIs).
services:
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=^file:///tmp/.*
      - --api-disable-download-from=true
    ports:
      - "127.0.0.1:3000:3000"

  # PDF/A validator for the test suite (VERAPDF_URL); not needed at runtime.
  verapdf:
    image: verapdf/rest:latest
    platform: linux/amd64
    ports:
      - "127.0.0.1:3001:8080"
